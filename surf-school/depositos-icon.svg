<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="#0f2460"/>

  <!-- Surfboard shape (tall oval, slight tilt) -->
  <ellipse cx="96" cy="90" rx="34" ry="76" fill="white" transform="rotate(8 96 90)"/>

  <!-- Board center rail stripe -->
  <ellipse cx="96" cy="90" rx="18" ry="62" fill="#4fc9e8" transform="rotate(8 96 90)"/>

  <!-- Board fin at tail -->
  <path d="M 80,148 Q 90,165 100,148" fill="#1e3a8a" transform="rotate(8 96 90)"/>

  <!-- € symbol on board -->
  <text x="70" y="108" font-family="'Arial Black',Arial,sans-serif" font-size="58" font-weight="900" fill="#0f2460">€</text>

  <!-- Wave left -->
  <path d="M 14,162 Q 30,150 46,162 Q 62,174 78,162" stroke="#56cce8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Wave right -->
  <path d="M 114,162 Q 130,150 146,162 Q 162,174 178,162" stroke="#56cce8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>
