<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="#0f2460"/>

  <!-- Surfboard body (white, upright oval + pointed nose) -->
  <ellipse cx="96" cy="95" rx="36" ry="65" fill="white"/>
  <!-- Pointed nose -->
  <polygon points="96,20 62,52 130,52" fill="white"/>
  <!-- Board center rail in cyan -->
  <ellipse cx="96" cy="95" rx="20" ry="51" fill="#4fc9e8"/>
  <!-- Tail fin -->
  <polygon points="80,150 96,173 112,150" fill="white"/>

  <!-- € symbol drawn as paths (no font) -->
  <!-- C-curve of the € -->
  <path d="M122,75 A30,34 0 1,0 122,117" stroke="#0f2460" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Top bar -->
  <line x1="60" y1="83" x2="114" y2="83" stroke="#0f2460" stroke-width="9" stroke-linecap="round"/>
  <!-- Bottom bar -->
  <line x1="60" y1="105" x2="114" y2="105" stroke="#0f2460" stroke-width="9" stroke-linecap="round"/>

  <!-- Wave left -->
  <path d="M12,168 Q26,156 40,168 Q54,180 68,168" stroke="#56cce8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Wave right -->
  <path d="M124,168 Q138,156 152,168 Q166,180 180,168" stroke="#56cce8" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
