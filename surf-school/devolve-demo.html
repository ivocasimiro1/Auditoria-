<title>Devolve — Pré-visualização</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --surface3:#2d333b;
  --border:#30363d;
  --accent:#2dd4bf; --accent-dim:#0f3d38; --accent-text:#0d1117;
  --green:#3fb950; --green-dim:#1a4a24;
  --yellow:#d29922; --yellow-dim:#4a3800;
  --red:#f85149; --red-dim:#4a1515;
  --purple:#8b5cf6; --purple-dim:#2e1b5e;
  --text:#c9d1d9; --text-bright:#f0f6fc; --muted:#8b949e;
  /* paleta categórica (ordem fixa, validada — ver skill dataviz) */
  --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#9085e9;
  --grid-line:#2c2c2a;
  --radius:8px; --radius-lg:14px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overscroll-behavior:none;}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;}
a{color:inherit;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--accent-dim);color:var(--text-bright);}
.hidden{display:none!important;}
.tabular{font-variant-numeric:tabular-nums;}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text-bright);font-weight:600;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;}
.btn:hover{border-color:var(--muted);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{background:var(--red-dim);border-color:var(--red);color:#ffb4ae;}
.btn.ghost{background:transparent;}
.btn.block{width:100%;}
.btn.sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text-bright);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.field-row{grid-template-columns:1fr;}}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);}
.check input{width:auto;}

/* ---------- demo badge / note ---------- */
.demo-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--purple-dim);color:#c9aefc;margin-left:8px;}
.demo-note{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:9px 14px;border-radius:var(--radius);font-size:12.5px;margin-bottom:18px;}
.demo-note b{color:var(--text-bright);}

/* ================= LANDING ================= */
.landing-nav{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.landing-nav-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
@media(max-width:480px){.landing-nav-in .btn{padding:8px 12px;font-size:12px;}}
.logo{font-size:19px;font-weight:800;color:var(--text-bright);letter-spacing:-.4px;display:flex;align-items:center;gap:8px;}
.logo .mark{color:var(--accent);}
.landing-nav-links{display:flex;gap:22px;font-size:13.5px;color:var(--muted);flex:1;justify-content:center;}
.landing-nav-links a:hover{color:var(--text-bright);}
@media(max-width:720px){.landing-nav-links{display:none;}}

.hero{max-width:900px;margin:0 auto;padding:88px 24px 60px;text-align:center;}
.hero .kicker{color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px;}
.hero h1{font-size:52px;line-height:1.05;letter-spacing:-1.5px;color:var(--text-bright);margin-bottom:20px;}
.hero h1 em{font-style:normal;color:var(--accent);}
.hero p{font-size:18px;color:var(--muted);max-width:60ch;margin:0 auto 34px;}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.hero-cta .btn{padding:13px 24px;font-size:14.5px;}
@media(max-width:600px){.hero h1{font-size:34px;}.hero{padding:56px 20px 40px;}}
@media(max-width:480px){.hero-cta{flex-direction:column;align-items:stretch;}.hero-cta .btn{width:100%;}}

.marquee{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface);overflow:hidden;padding:16px 0;}
.marquee-track{display:flex;gap:40px;white-space:nowrap;animation:scroll 28s linear infinite;width:max-content;}
@media(prefers-reduced-motion:reduce){.marquee-track{animation:none;}}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.marquee-item{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.marquee-item .ico{font-size:17px;}

.section-wrap{max-width:1120px;margin:0 auto;padding:80px 24px;}
.section-head{max-width:640px;margin:0 auto 44px;text-align:center;}
.section-head .kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;}
.section-head h2{font-size:32px;color:var(--text-bright);letter-spacing:-.5px;margin-bottom:12px;text-wrap:balance;}
.section-head p{color:var(--muted);font-size:15.5px;}

.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:860px){.feature-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.feature-grid{grid-template-columns:1fr;}}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;}
.feature-card .ico{font-size:26px;margin-bottom:14px;display:inline-block;}
.feature-card h3{font-size:15.5px;color:var(--text-bright);margin-bottom:8px;}
.feature-card p{font-size:13.5px;color:var(--muted);line-height:1.55;}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:step;}
@media(max-width:760px){.steps{grid-template-columns:1fr;}}
.step{position:relative;padding-left:0;}
.step .num{font-family:ui-monospace,monospace;font-size:13px;color:var(--accent);font-weight:700;margin-bottom:10px;display:block;}
.step h3{font-size:16px;color:var(--text-bright);margin-bottom:8px;}
.step p{font-size:13.5px;color:var(--muted);}

.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch;}
@media(max-width:860px){.pricing-grid{grid-template-columns:1fr;max-width:380px;margin:0 auto;}}
.price-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;display:flex;flex-direction:column;gap:16px;}
.price-card.featured{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.price-card .tier{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.price-card .amount{font-size:34px;color:var(--text-bright);letter-spacing:-1px;}
.price-card .amount span{font-size:14px;color:var(--muted);font-weight:400;}
.price-card ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13.5px;color:var(--text);flex:1;}
.price-card li::before{content:"✓ ";color:var(--accent);font-weight:700;}

.landing-footer{border-top:1px solid var(--border);padding:34px 24px;text-align:center;color:var(--muted);font-size:12.5px;}

/* ================= AUTH ================= */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;}
.auth-card .logo{justify-content:center;margin-bottom:6px;}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px;}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
.auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;}
.onb-progress{display:flex;gap:6px;margin-bottom:22px;}
.onb-progress i{flex:1;height:3px;border-radius:3px;background:var(--surface3);}
.onb-progress i.on{background:var(--accent);}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tpl-card{border:1px solid var(--border);background:var(--surface2);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;}
.tpl-card:hover{border-color:var(--accent);}
.tpl-card.sel{border-color:var(--accent);background:var(--accent-dim);}
.tpl-card .ico{font-size:22px;display:block;margin-bottom:6px;}
.tpl-card .name{font-size:12.5px;font-weight:600;color:var(--text-bright);}
.err-box{background:var(--red-dim);border:1px solid var(--red);color:#ffb4ae;padding:9px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;}
.ok-box{background:var(--green-dim);border:1px solid var(--green);color:#b7f0c0;padding:9px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;}

/* ================= APP SHELL ================= */
.shell{display:flex;min-height:100vh;}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;}
.sidebar .logo{padding:18px 20px;border-bottom:1px solid var(--border);}
.side-biz{padding:14px 20px;border-bottom:1px solid var(--border);}
.side-biz .n{font-size:13px;font-weight:700;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-biz .p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.side-nav{flex:1;padding:12px;display:flex;flex-direction:column;gap:2px;}
.side-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;position:relative;}
.side-link:hover{background:var(--surface2);color:var(--text-bright);}
.side-link.on{background:var(--accent-dim);color:var(--accent);}
.side-link .ico{font-size:15px;width:18px;text-align:center;}
.side-link .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 6px;}
.side-foot{padding:12px;border-top:1px solid var(--border);}
.main{flex:1;margin-left:220px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;}
.topbar h1{font-size:17px;color:var(--text-bright);}
.topbar .spacer{flex:1;}
.content{padding:26px 28px 60px;max-width:1220px;width:100%;margin:0 auto;}
.mobile-topbar{display:none;}
.bottom-nav{display:none;}
.sidebar-backdrop{display:none;}
@media(max-width:900px){
  .shell{flex-direction:column;}
  .sidebar{display:none;}
  .main{margin-left:0;width:100%;}
  .topbar{display:none;}
  .mobile-topbar{
    display:flex;align-items:center;gap:10px;padding:14px 18px;
    border-bottom:1px solid var(--border);background:rgba(13,17,23,.92);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:30;
  }
  .mobile-topbar h1{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--text-bright);flex:1;}
  .mobile-topbar .logo{font-size:20px;}
  .content{padding:18px 16px 96px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(22,27,34,.97);backdrop-filter:blur(14px);border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px rgba(0,0,0,.3);
  }
}

.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;position:relative;border-radius:10px;}
.bottom-nav-item.on{color:var(--accent);}
.bottom-nav-item .ico{font-size:19px;}
.bottom-nav-item .badge{position:absolute;top:2px;right:22%;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:20px;padding:0 4px;line-height:1.4;}
.mais-list{display:flex;flex-direction:column;gap:2px;}
.mais-item{display:flex;align-items:center;gap:12px;padding:13px 8px;border-radius:var(--radius);color:var(--text);font-size:14.5px;font-weight:600;cursor:pointer;}
.mais-item:hover, .mais-item:active{background:var(--surface2);}
.mais-item .ico{font-size:17px;width:20px;text-align:center;}
.mais-item.danger{color:#ff9b93;}

/* ---------- generic card / stat / pill ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.card-header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.card-title{font-weight:700;color:var(--text-bright);font-size:14.5px;}
.card-body{padding:18px;}
.section-title{font-size:19px;color:var(--text-bright);font-weight:700;margin-bottom:4px;}
.section-sub{color:var(--muted);font-size:13px;margin-bottom:20px;}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
@media(max-width:700px){.stat-row{grid-template-columns:repeat(3,1fr);gap:9px;}}
.stat{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;cursor:pointer;transition:.15s;overflow:hidden;}
.stat:hover{border-color:var(--muted);transform:translateY(-2px);}
.stat:active{transform:scale(.98);}
.stat .stat-ico{position:absolute;top:14px;right:14px;font-size:18px;opacity:.5;}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:6px;}
.stat .num{font-size:34px;font-weight:800;color:var(--text-bright);line-height:1;}
.stat.ok{border-left:3px solid var(--green);}
.stat.warn{border-left:3px solid var(--yellow);}
.stat.crit{border-left:3px solid var(--red);}
@media(max-width:700px){
  .stat{padding:14px 12px;border-radius:12px;}
  .stat .stat-ico{display:none;}
  .stat .lbl{font-size:9.5px;letter-spacing:.02em;margin-bottom:4px;line-height:1.2;}
  .stat .num{font-size:26px;}
  .stat.ok,.stat.warn,.stat.crit{border-left-width:0;border-top:3px solid;}
  .stat.ok{border-top-color:var(--green);}
  .stat.warn{border-top-color:var(--yellow);}
  .stat.crit{border-top-color:var(--red);}
}
/* hero de receita/resumo */
.hero-stat{background:linear-gradient(135deg,var(--accent-dim),var(--surface));border:1px solid var(--accent);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.hero-stat .big{flex:1;min-width:160px;}
.hero-stat .big .lbl{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px;}
.hero-stat .big .val{font-size:32px;font-weight:800;color:var(--text-bright);line-height:1;}
.hero-stat .big .sub{font-size:12.5px;color:var(--muted);margin-top:6px;}
.hero-stat .mini{display:flex;gap:20px;}
.hero-stat .mini .m .v{font-size:20px;font-weight:800;color:var(--text-bright);}
.hero-stat .mini .m .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
.pill.ok{background:var(--green-dim);color:#7ee08a;}
.pill.warn{background:var(--yellow-dim);color:#f0c05a;}
.pill.crit{background:var(--red-dim);color:#ff9b93;}
.pill::before{content:"●";font-size:.6em;}

.banner{display:flex;align-items:center;gap:12px;background:var(--red-dim);border:1px solid var(--red);color:#ffb4ae;padding:13px 16px;border-radius:var(--radius);margin-bottom:20px;font-size:13.5px;}
.banner .btn{margin-left:auto;flex-shrink:0;}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ico{font-size:36px;margin-bottom:12px;}

/* ---------- rental cards ---------- */
.rental-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;}
.rcard.crit{border-color:var(--red);}
.rcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.rcard .client{font-weight:700;color:var(--text-bright);font-size:14.5px;}
.rcard .phone{font-size:12px;color:var(--muted);}
.rcard .items{font-size:12.5px;color:var(--text);display:flex;flex-wrap:wrap;gap:5px;}
.rcard .items span{background:var(--surface2);padding:2px 8px;border-radius:20px;}
.rcard .countdown{font-family:ui-monospace,monospace;font-size:18px;font-weight:700;color:var(--text-bright);}
.rcard .countdown.crit{color:var(--red);}
.rcard .countdown.warn{color:var(--yellow);}
.rcard .countdown.ok{color:var(--green);}
.rcard .meta{font-size:11.5px;color:var(--muted);}
.rcard-actions{display:flex;gap:8px;margin-top:auto;}

.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.toolbar input[type=text]{max-width:260px;}
.toolbar select{max-width:200px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.chip.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.chip.u-ok{border-color:var(--green);color:#7ee08a;font-family:ui-monospace,monospace;font-size:12px;padding:4px 10px;}
.chip.u-crit{border-color:var(--red);color:#ff9b93;background:var(--red-dim);cursor:default;font-family:ui-monospace,monospace;font-size:12px;padding:4px 10px;}
.chip.u-warn{border-color:var(--yellow);color:#f0c05a;background:var(--yellow-dim);font-family:ui-monospace,monospace;font-size:12px;padding:4px 10px;}

/* ---------- novo aluguer layout ---------- */
.novo-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:flex-start;}
@media(max-width:920px){.novo-grid{grid-template-columns:1fr;}}
.item-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.item-pick{border:1px solid var(--border);background:var(--surface2);border-radius:var(--radius);padding:12px;}
.item-pick .pick-thumb{aspect-ratio:4/3;border-radius:8px;background:linear-gradient(160deg,var(--surface3),var(--surface2));display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;}
.item-pick .pick-thumb img{width:100%;height:100%;object-fit:cover;}
.item-pick .n{font-size:13px;font-weight:600;color:var(--text-bright);margin-bottom:2px;}
.item-pick .avail{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
.item-pick .avail.zero{color:var(--red);}
.item-pick-row{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface3);color:var(--text-bright);cursor:pointer;font-weight:700;}
.qty-val{width:24px;text-align:center;font-weight:700;}
.cart-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cart-line:last-child{border-bottom:none;}
.cart-line .x{color:var(--red);cursor:pointer;font-weight:700;}
.summary-devol{background:var(--accent-dim);border:1px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-top:12px;font-size:13px;color:var(--text-bright);}
.summary-devol b{color:var(--accent);}

/* ---------- catalogo (montra tipo loja) ---------- */
.shop-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.shop-toolbar .chip-row{flex:1;}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
.shop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s;}
.shop-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35);}
.shop-card .photo{aspect-ratio:4/3;background:linear-gradient(160deg,var(--surface2),var(--surface3));display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--muted);overflow:hidden;}
.shop-card .photo img{width:100%;height:100%;object-fit:cover;display:block;}
.art-badge{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--accent-dim),var(--surface3));display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:inset 0 0 0 1px var(--border);}
.shop-card .body{padding:13px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
.shop-card .cat-tag{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.shop-card .name{font-weight:700;color:var(--text-bright);font-size:14.5px;line-height:1.3;}
.shop-card .price{color:var(--accent);font-weight:800;font-size:15px;margin-top:2px;}
.shop-card .price small{color:var(--muted);font-weight:500;font-size:11.5px;}
.shop-card .stock-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;}
.shop-card .stock-row .cnt{font-size:11.5px;color:var(--muted);}
.photo-upload{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.photo-upload .preview{width:88px;height:88px;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted);overflow:hidden;flex-shrink:0;}
.photo-upload .preview img{width:100%;height:100%;object-fit:cover;}
.photo-upload input[type=file]{font-size:12px;}
.item-detail-units{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}

/* ---------- loja pública (auto-reserva do cliente) ---------- */
.cstore{min-height:100vh;padding-bottom:120px;}
.cstore-hero{background:linear-gradient(135deg,var(--accent-dim),var(--surface));border-bottom:1px solid var(--border);padding:34px 20px 28px;text-align:center;}
.cstore-hero .biz{font-size:26px;font-weight:800;color:var(--text-bright);letter-spacing:-.5px;margin-bottom:4px;}
.cstore-hero .sub{color:var(--muted);font-size:14px;}
.cstore-hero .badge-demo{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:rgba(45,212,191,.12);border:1px solid var(--accent);padding:4px 12px;border-radius:20px;}
.cstore-wrap{max-width:1000px;margin:0 auto;padding:22px 16px;}
.cstore-cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.cbook-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(22,27,34,.98);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.35);}
.cbook-bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;}
.novo-cart-bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(22,27,34,.98);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 20px;box-shadow:0 -4px 20px rgba(0,0,0,.35);}
.novo-cart-bar-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:14px;}
.novo-cart-bar .cnt{flex:1;font-size:13.5px;color:var(--text);}
@media(max-width:900px){ .novo-cart-bar{ bottom:64px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); } }
.cbook-bar .cnt{flex:1;font-size:13.5px;color:var(--text);}
.cbook-bar .cnt b{color:var(--text-bright);}
.shop-card .add-btn{margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;}
.shop-card .add-btn:disabled{opacity:.4;border-color:var(--border);background:var(--surface2);color:var(--muted);cursor:not-allowed;}
.shop-card .in-cart{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
.cstore-success{max-width:520px;margin:60px auto;text-align:center;padding:0 20px;}
.cstore-success .big{font-size:60px;margin-bottom:16px;}
.cstore-success h2{font-size:24px;color:var(--text-bright);margin-bottom:10px;}
.cstore-success p{color:var(--muted);font-size:14.5px;margin-bottom:8px;}

.cat-list{display:flex;flex-direction:column;gap:10px;}
.cat-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;}
.cat-row-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
.cat-row-head .ico{font-size:20px;}
.cat-row-head .n{font-weight:700;color:var(--text-bright);flex:1;}
.cat-row-head .cnt{font-size:12px;color:var(--muted);}
.cat-body{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.item-row:last-child{border-bottom:none;}
.item-row .n{flex:1;font-weight:600;color:var(--text-bright);}
.item-row .q{color:var(--muted);font-size:12px;}
.field-extra-row{display:flex;gap:8px;align-items:center;background:var(--surface2);padding:8px 10px;border-radius:var(--radius);margin-bottom:6px;font-size:12.5px;}
.field-extra-row .x{color:var(--red);cursor:pointer;font-weight:700;margin-left:auto;}

/* ---------- analytics ---------- */
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;}
canvas{max-width:100%;}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.rank-row:last-child{border-bottom:none;}
.rank-row .bar{height:6px;border-radius:6px;background:var(--accent);}
.rank-row .bar-track{flex:1;background:var(--surface2);border-radius:6px;overflow:hidden;}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.modal-head h3{font-size:15.5px;color:var(--text-bright);flex:1;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
.close-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border);color:var(--text-bright);padding:11px 20px;border-radius:var(--radius);font-size:13.5px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.4);}

function el(id){ return document.getElementById(id); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})+' '+dt.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){
  const host = el('toast-host');
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  host.appendChild(t);

/* ============================================================
   Cálculos de negócio
   ============================================================ */
function precoPorUnidade(item, unidade, duracao){
  const preco = item? (item.preco||0) : 0;   // preço/dia
  if(unidade==='dias') return preco*duracao;
  // por horas: fracção do dia (dia útil ~8h) com mínimo de meio-dia — evita "cêntimos"
  const porHora = preco/8;
  return Math.max(porHora*duracao, preco*0.5);
}
function calcDevolucaoPrevista(inicioISO, unidade, duracao, horarioFecho){
  const inicio = new Date(inicioISO);
  if(unidade === 'horas'){
    return new Date(inicio.getTime() + duracao*3600*1000);
  }
  // dias: soma N dias e fixa à hora de fecho configurada
  const d = new Date(inicio);
  d.setDate(d.getDate() + duracao);
  const [hh,mm] = (horarioFecho||'18:00').split(':').map(Number);
  d.setHours(hh||18, mm||0, 0, 0);
  return d;
}
function estadoEfectivo(r){
  if(r.estado==='pendente') return 'pendente'; // pedido do cliente à espera de confirmação
  if(r.devolucao_real) return r.estado; // devolvido | atraso (final)
  const prev = new Date(r.devolucao_prevista).getTime();
  const now = Date.now();
  if(now > prev) return 'atraso';
  if(prev - now <= 3*3600*1000) return 'avencer';
  return 'activo';
}
function msRestantes(r){ return new Date(r.devolucao_prevista).getTime() - Date.now(); }
function fmtCountdown(ms){
  const neg = ms < 0; const a = Math.abs(ms);
  const h = Math.floor(a/3600000), m = Math.floor((a%3600000)/60000);
  const dd = Math.floor(h/24);
  let s;
  if(dd >= 1) s = dd+'d '+(h%24)+'h';
  else s = (h+'h '+String(m).padStart(2,'0')+'m');
  return (neg? '+' : '') + s + (neg? ' atraso' : '');
}
function stockDisponivel(itemId){
  return state.units.filter(u=>u.item_id===itemId && u.estado==='disponivel').length;

}

  const s = state.signup;
  const tenant = { id: uid(), nome: s.nomeNegocio, sector: s.sector, whatsapp_numero: s.whatsapp, plano:'trial', conta_activa:true, aprovado:false, proximo_pagamento: addMonths(new Date(),1).toISOString(), criado_em: new Date().toISOString() };

    if(DEVOLVE_HQ_WHATSAPP) window.open(waUrl(DEVOLVE_HQ_WHATSAPP, avisoMsg), '_blank');
    if(DEVOLVE_HQ_EMAIL) window.open(emailUrl(DEVOLVE_HQ_EMAIL, 'Novo pedido de conta '+APP_NAME, avisoMsg), '_blank');
  }
  const cfg = {

  };
  const categories = []; const items = []; const units = [];
  const tpl = CATALOG_TEMPLATES[s.template];
  tpl.categorias.forEach(cat=>{

    categories.push({ id:catId, tenant_id:tenant.id, nome:cat.nome, icone:cat.icone, campos_extra:cat.campos_extra, ordem:categories.length });

let tickerStarted = false;
function startTicker(){
  if(tickerStarted) return; tickerStarted = true;
  setInterval(()=>{
    document.querySelectorAll('.countdown[data-target]').forEach(elc=>{
      const target = new Date(elc.dataset.target).getTime();
      const ms = target - Date.now();
      elc.textContent = fmtCountdown(ms);
      elc.classList.remove('ok','warn','crit');
      elc.classList.add(ms<0?'crit':(ms<3*3600*1000?'warn':'ok'));
    });
  }, 1000);
}

function cb_bind(k,v){ state.clientBooking[k]=v; }
function cb_setCat(id){ state.clientBooking.catSel=id; render(); }
function cb_qty(itemId, delta){
  const b = state.clientBooking;
  const item = state.items.find(i=>i.id===itemId);
  let line = b.cart.find(c=>c.item_id===itemId);
  if(delta>0){
    if((line?line.qtd:0) >= stockDisponivel(itemId)) return;
    if(!line){ line={item_id:itemId, nome:item.nome, qtd:0}; b.cart.push(line); }
    line.qtd++;
  } else if(line){
    line.qtd--; if(line.qtd<=0) b.cart = b.cart.filter(c=>c.item_id!==itemId);
  }
  render();
}
function cb_submit(){
  const b = state.clientBooking;
  if(!b.nome){ toast('Escreve o teu nome.'); return; }
  if(!b.telefone){ toast('O telefone é obrigatório.'); return; }
  const pais = countryByCode(b.pais);
  const inicio = new Date().toISOString();
  const prevista = calcDevolucaoPrevista(inicio, b.unidade, b.duracao, state.cfg? state.cfg.horario_fecho : '18:00');
  const itensSnapshot = b.cart.map(c=>{ const item=state.items.find(i=>i.id===c.item_id); return { item_id:c.item_id, nome:c.nome, quantidade:c.qtd, unit_ids:[], unit_codigos:[], preco_unit:item?item.preco:0 }; });
  const precoTotal = b.cart.reduce((s,c)=>{ const item=state.items.find(i=>i.id===c.item_id); return s + c.qtd*precoPorUnidade(item,b.unidade,b.duracao); },0);
  const rental = {
    id: uid(), tenant_id: state.tenantId,
    cliente_nome: b.nome, cliente_telefone: b.telefone, cliente_email: b.email, cliente_doc:'',
    cliente_pais: b.pais, cliente_lang: pais.lang,
    itens: itensSnapshot, inicio, unidade_duracao: b.unidade, duracao: b.duracao,
    devolucao_prevista: prevista.toISOString(), devolucao_real: null,
    estado:'pendente', origem:'cliente', caucao:0, preco_total: precoTotal, notas:'', criado_em: inicio
  };
  state.rentals.unshift(rental);
  saveLocal();
  state.clientBooking.enviado = true;
  closeModal();
  render();
}

function confirmarPendente(id){
  const r = state.rentals.find(x=>x.id===id);
  if(!r) return;
  // atribui unidades reais agora (só na confirmação é que o stock é comprometido)
  let faltou = false;
  (r.itens||[]).forEach(linha=>{
    const escolhidas = [];
    for(let k=0;k<linha.quantidade;k++){
      const u = state.units.filter(x=>x.item_id===linha.item_id && x.estado==='disponivel' && !escolhidas.includes(x.id)).sort((a,b)=>a.codigo.localeCompare(b.codigo))[0];
      if(u){ escolhidas.push(u.id); u.estado='alugada'; } else faltou=true;
    }
    linha.unit_ids = escolhidas;
    linha.unit_codigos = escolhidas.map(uid2=>{ const u=state.units.find(x=>x.id===uid2); return u?u.codigo:''; });
  });
  r.estado = 'activo';
  saveLocal();
  // WhatsApp de confirmação na língua do cliente
  const pais = countryByCode(r.cliente_pais);
  const itensTxt = (r.itens||[]).map(i=>i.quantidade+'× '+i.nome).join(', ');
  const msg = msgFor(r.cliente_lang||pais.lang, 'confirm', { nome:r.cliente_nome, loja:(state.cfg&&state.cfg.nome_negocio)||'Devolve', itens:itensTxt, prazo:fmtDateTime(r.devolucao_prevista), preco:r.preco_total?r.preco_total.toFixed(2):'', caucao:'' });
  if(r.cliente_telefone) window.open(waUrl(r.cliente_telefone, msg, pais.dial), '_blank');
  if(r.cliente_email){
    const lang = r.cliente_lang||pais.lang;
    window.open(emailUrl(r.cliente_email, (SUBJ[lang]||SUBJ.pt).confirm+' — '+((state.cfg&&state.cfg.nome_negocio)||APP_NAME), msg), '_blank');
  }
  toast(faltou? 'Confirmado, mas faltou stock nalguns artigos.' : 'Reserva confirmada — aviso enviado ✅');
  render();
}
function recusarPendente(id){
  if(!confirm('Recusar este pedido de reserva?')) return;
  state.rentals = state.rentals.filter(r=>r.id!==id);
  saveLocal();
  render();
}

function devolverAluguer(id){
  const r = state.rentals.find(x=>x.id===id);
  if(!r) return;
  const agora = new Date().toISOString();
  r.devolucao_real = agora;
  r.estado = Date.now() > new Date(r.devolucao_prevista).getTime() ? 'atraso' : 'devolvido';
  (r.itens||[]).forEach(linha=> (linha.unit_ids||[]).forEach(uidv=>{
    const u = state.units.find(x=>x.id===uidv);
    if(u && u.estado==='alugada') u.estado = 'disponivel';
  }));
  saveLocal();
  // agradecimento por WhatsApp/email na língua do cliente (abrir antes de re-render)
  if(r.cliente_telefone || r.cliente_email){
    const pais = countryByCode(r.cliente_pais);
    const lang = r.cliente_lang||pais.lang;
    const itensTxt = (r.itens||[]).map(i=>i.nome).join(', ');
    const msg = msgFor(lang, 'obrigado', {
      nome: r.cliente_nome, loja: (state.cfg&&state.cfg.nome_negocio)||APP_NAME, itens: itensTxt
    });
    if(r.cliente_telefone) window.open(waUrl(r.cliente_telefone, msg, pais.dial), '_blank');
    if(r.cliente_email) window.open(emailUrl(r.cliente_email, (SUBJ[lang]||SUBJ.pt).obrigado+' — '+((state.cfg&&state.cfg.nome_negocio)||APP_NAME), msg), '_blank');
  }
  toast('Devolvido — agradecimento enviado 🙏');
  render();
}
function contactarCliente(id){
  const r = state.rentals.find(x=>x.id===id);
  if(!r || !r.cliente_telefone) return;
  const pais = countryByCode(r.cliente_pais);
  const lang = r.cliente_lang||pais.lang;
  const itensTxt = (r.itens||[]).map(i=>i.quantidade+'× '+i.nome).join(', ');
  const emAtraso = !r.devolucao_real && estadoEfectivo(r)==='atraso';
  const msg = emAtraso
    ? msgFor(lang, 'atraso', { nome:r.cliente_nome, loja:(state.cfg&&state.cfg.nome_negocio)||'Devolve', itens:itensTxt, prazo:fmtDateTime(r.devolucao_prevista) })
    : msgFor(lang, 'confirm', { nome:r.cliente_nome, loja:(state.cfg&&state.cfg.nome_negocio)||'Devolve', itens:itensTxt, prazo:fmtDateTime(r.devolucao_prevista), preco:r.preco_total?r.preco_total.toFixed(2):'', caucao:r.caucao?r.caucao.toFixed(2):'' });
  window.open(waUrl(r.cliente_telefone, msg, pais.dial), '_blank');
}

/* ---- adicionar/editar 1 artigo ao carrinho (com a sua própria duração) ---- */
let _itemDraft = null;
function nv_openItemAdd(itemId){
  const item = state.items.find(i=>i.id===itemId);
  const existing = state.novo.cart.find(c=>c.item_id===itemId);
  const disp = stockDisponivel(itemId);
  _itemDraft = existing
    ? { item_id:itemId, nome:item.nome, quantidade:existing.unit_ids.length, unidade:existing.unidade, duracao:existing.duracao, disp }
    : { item_id:itemId, nome:item.nome, quantidade: disp>0?1:0, unidade: state.novo.lastUnidade||'dias', duracao: state.novo.lastDuracao||1, disp };
  renderModal(itemAddModalHtml());
}
function itemAddModalHtml(){
  const d = _itemDraft;
  const item = state.items.find(i=>i.id===d.item_id);
  const prevista = calcDevolucaoPrevista(new Date().toISOString(), d.unidade, d.duracao, state.cfg? state.cfg.horario_fecho : '18:00');
  const jaExiste = state.novo.cart.some(c=>c.item_id===d.item_id);
  return `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-head"><h3>${d.nome}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>Quantidade (${d.disp} disponíveis)</label>
        <div class="item-pick-row">
          <button class="qty-btn" onclick="id_qty(-1)">−</button>
          <span class="qty-val tabular">${d.quantidade}</span>
          <button class="qty-btn" onclick="id_qty(1)" ${d.quantidade>=d.disp?'disabled':''}>+</button>
        </div>
      </div>
      <div class="field">
        <label>Duração deste artigo</label>
        <div class="chip-row"><div class="chip ${d.unidade==='horas'?'sel':''}" onclick="id_setUnidade('horas')">Horas</div><div class="chip ${d.unidade==='dias'?'sel':''}" onclick="id_setUnidade('dias')">Dias</div></div>
      </div>
      <div class="field"><label>Nº de ${d.unidade}</label><input type="number" min="1" id="id-dur" value="${d.duracao}" oninput="id_setDuracao(this.value)"></div>
      ${d.quantidade>0? `<div class="summary-devol">Devolução prevista: <b>${fmtDateTime(prevista)}</b> · €${(d.quantidade*precoPorUnidade(item,d.unidade,d.duracao)).toFixed(2)}</div>` : ''}
    </div>
    <div class="modal-foot">
      ${jaExiste? `<button class="btn danger" onclick="nv_removeCart('${d.item_id}');closeModal()">Remover</button>` : ''}
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="nv_confirmItemDraft()" ${d.quantidade<=0?'disabled':''}>${jaExiste?'Guardar':'Adicionar'}</button>
    </div>
  </div></div>`;
}
function id_qty(delta){ _itemDraft.quantidade = Math.max(0, Math.min(_itemDraft.disp, _itemDraft.quantidade+delta)); renderModal(itemAddModalHtml()); }
function id_setUnidade(u){ _itemDraft.unidade = u; renderModal(itemAddModalHtml()); }
function id_setDuracao(v){ _itemDraft.duracao = Math.max(1, parseInt(v)||1); renderModal(itemAddModalHtml()); }
function nv_confirmItemDraft(){
  const d = _itemDraft;
  const n = state.novo;
  n.cart = n.cart.filter(c=>c.item_id!==d.item_id);
  if(d.quantidade>0){
    const unidades = state.units.filter(u=>u.item_id===d.item_id && u.estado==='disponivel').sort((a,b)=>a.codigo.localeCompare(b.codigo)).slice(0,d.quantidade);
    n.cart.push({ item_id:d.item_id, nome:d.nome, unit_ids:unidades.map(u=>u.id), unidade:d.unidade, duracao:d.duracao });
    n.lastUnidade = d.unidade; n.lastDuracao = d.duracao;
  }
  closeModal();
  render();
}
function nv_openResumo(){ renderModal(resumoModalHtml()); }

function resumoModalHtml(){
  const n = state.novo;
  const gruposDif = new Set(n.cart.map(c=>c.unidade+'|'+c.duracao)).size;
  const caucaoSugerida = n.cart.reduce((sum,c)=>{ const item=state.items.find(i=>i.id===c.item_id); return sum + c.unit_ids.length*(item&&item.caucao_sugerida||0); },0);
  return `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-head"><h3>Resumo do aluguer</h3><button class="close-x" onclick="closeModal()">✕</button></div>

      ${n.cart.length===0? `<div class="empty" style="padding:24px 10px"><div class="ico">🛒</div>Sem artigos seleccionados</div>` :
        n.cart.map(c=>{
          const item = state.items.find(i=>i.id===c.item_id);
          const codigos = c.unit_ids.map(uidv=>{ const u=state.units.find(x=>x.id===uidv); return u? u.codigo : ''; }).join(', ');
          const subtotal = c.unit_ids.length*precoPorUnidade(item, c.unidade, c.duracao);
          return `<div class="cart-line" onclick="closeModal();nv_openItemAdd('${c.item_id}')" style="cursor:pointer">
            <span>${c.unit_ids.length}× ${c.nome} <span style="color:var(--muted);font-size:11.5px">(${codigos}) · ${linhaDuracaoTxt(c)} · €${subtotal.toFixed(2)}</span></span>
            <span class="x" onclick="event.stopPropagation();nv_removeCart('${c.item_id}');renderModal(resumoModalHtml())">✕</span>
          </div>`;
        }).join('')
      }
      ${gruposDif>1? `<div style="font-size:11.5px;color:var(--accent);margin-top:8px">ℹ️ Este aluguer tem ${gruposDif} prazos diferentes — vai gerar ${gruposDif} registos separados (mesmo cliente), um WhatsApp só com tudo.</div>` : ''}
      ${n.cart.length>0? `
        <div class="field-row" style="margin-top:14px">
          <div class="field"><label>Caução (€)</label><input type="number" min="0" step="1" id="nv-caucao" value="${n.caucao}" oninput="nv_bind('caucao', parseFloat(this.value)||0)"></div>
          <div class="field"><label>Preço total (€)${gruposDif>1?' <span style="color:var(--muted);font-weight:400">— desactivado com prazos diferentes</span>':''}</label>
            <input type="number" min="0" step="0.5" id="nv-preco" ${gruposDif>1?'disabled':''} value="${(n.preco_manual!=null? n.preco_manual : estimarPreco()).toFixed(2)}" oninput="nv_bind('preco_manual', parseFloat(this.value)||0)">
          </div>
        </div>
        ${caucaoSugerida>0? `<div style="font-size:11.5px;color:var(--muted);margin-top:5px">Caução sugerida pelos artigos: €${caucaoSugerida.toFixed(2)} — <a onclick="nv_usarCaucaoSugerida(${caucaoSugerida});renderModal(resumoModalHtml())" style="color:var(--accent);cursor:pointer;font-weight:600">usar</a></div>` : ''}
        ${gruposDif===1 && n.preco_manual!=null? `<div style="font-size:11.5px;color:var(--muted);margin-top:5px">Estimativa: €${estimarPreco().toFixed(2)} — <a onclick="nv_resetPreco();renderModal(resumoModalHtml())" style="color:var(--accent);cursor:pointer;font-weight:600">repor</a></div>` : ''}
        <div class="summary-devol">Total estimado: <b>€${estimarPreco().toFixed(2)}</b></div>
      ` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">← Voltar</button>
      <button class="btn primary block" onclick="confirmarAluguer()" ${(!n.cliente_nome || !n.cliente_telefone || n.cart.length===0)?'disabled':''}>Confirmar & Enviar WhatsApp</button>
    </div>
    ${(!n.cliente_telefone && n.cart.length>0)? `<div style="font-size:11.5px;color:var(--yellow);padding:0 20px 16px;text-align:center">⚠ Telefone obrigatório para contactar o cliente</div>`:''}
  </div></div>`;
}
function estimarPreco(){
  const n = state.novo;
  return n.cart.reduce((sum,c)=>{ const item=state.items.find(i=>i.id===c.item_id); return sum + c.unit_ids.length*precoPorUnidade(item,c.unidade,c.duracao); },0);
}
function nv_bind(k,v){ state.novo[k]=v; }
function nv_setPais(v){ state.novo.cliente_pais=v; render(); }
function nv_resetPreco(){ state.novo.preco_manual=null; render(); }
function nv_usarCaucaoSugerida(valor){ state.novo.caucao = valor; render(); }
function nv_setCat(id){ state.novo.catSel = id; render(); }
function nv_removeCart(itemId){ state.novo.cart = state.novo.cart.filter(c=>c.item_id!==itemId); render(); }

function confirmarAluguer(){
  const n = state.novo;
  if(!n.cliente_nome){ toast('Falta o nome do cliente.'); return; }
  if(!n.cliente_telefone){ toast('O telefone é obrigatório para contactar o cliente.'); return; }
  if(n.cart.length===0) return;
  const pais = countryByCode(n.cliente_pais);
  const inicio = new Date().toISOString();
  const horarioFecho = state.cfg? state.cfg.horario_fecho : '18:00';

  // Agrupar as linhas do carrinho por prazo (unidade+duração) — cada grupo gera um registo de aluguer próprio
  const grupos = {};
  const ordem = [];
  n.cart.forEach(c=>{
    const chave = c.unidade+'|'+c.duracao;
    if(!grupos[chave]){ grupos[chave] = { unidade:c.unidade, duracao:c.duracao, linhas:[] }; ordem.push(chave); }
    grupos[chave].linhas.push(c);
  });

  const precoTotalGeral = n.preco_manual!=null ? n.preco_manual : estimarPreco();
  const rentalsGerados = [];
  let devolucaoMaisCedo = null;
  const linhasParaMsg = [];

  ordem.forEach((chave, idx)=>{
    const g = grupos[chave];
    const prevista = calcDevolucaoPrevista(inicio, g.unidade, g.duracao, horarioFecho);
    if(!devolucaoMaisCedo || prevista < devolucaoMaisCedo) devolucaoMaisCedo = prevista;

    const itensSnapshot = g.linhas.map(c=>{
      const codigos = c.unit_ids.map(uidv=>{ const u=state.units.find(x=>x.id===uidv); return u? u.codigo : ''; });
      return { item_id:c.item_id, nome:c.nome, quantidade:c.unit_ids.length, unit_ids:[...c.unit_ids], unit_codigos:codigos };
    });
    const precoGrupo = g.linhas.reduce((sum,c)=>{ const item=state.items.find(i=>i.id===c.item_id); return sum + c.unit_ids.length*precoPorUnidade(item,c.unidade,c.duracao); },0);
    // se houver 1 só prazo, respeita o preço manual (se definido); com vários prazos, cada registo fica com o seu preço calculado
    const precoRegisto = (ordem.length===1 && n.preco_manual!=null) ? n.preco_manual : precoGrupo;

    g.linhas.forEach(c=>{
      linhasParaMsg.push(c.unit_ids.length+'× '+c.nome+' ('+linhaDuracaoTxt(c)+') — devolução '+fmtDateTime(prevista));
    });

    const rental = {
      id: uid(), tenant_id: state.tenantId,
      cliente_nome: n.cliente_nome, cliente_telefone: n.cliente_telefone,
      cliente_email: n.cliente_email, cliente_doc: n.cliente_doc,
      cliente_pais: n.cliente_pais, cliente_lang: pais.lang,
      itens: itensSnapshot, inicio, unidade_duracao: g.unidade, duracao: g.duracao,
      devolucao_prevista: prevista.toISOString(), devolucao_real: null,
      estado:'activo', caucao: idx===0? n.caucao : 0, preco_total: precoRegisto, notas: n.notas, criado_em: inicio
    };
    rentalsGerados.push(rental);
  });

  // abrir WhatsApp/email ANTES de qualquer processamento, para não serem bloqueados pelo browser
  const itensTxt = linhasParaMsg.join('\n');
  const msg = msgFor(pais.lang, 'confirm', {
    nome: n.cliente_nome, loja: (state.cfg&&state.cfg.nome_negocio)||APP_NAME,
    itens: itensTxt, prazo: fmtDateTime(devolucaoMaisCedo),
    preco: precoTotalGeral? precoTotalGeral.toFixed(2) : '', caucao: n.caucao? n.caucao.toFixed(2) : ''
  });
  window.open(waUrl(n.cliente_telefone, msg, pais.dial), '_blank');
  if(n.cliente_email) window.open(emailUrl(n.cliente_email, (SUBJ[pais.lang]||SUBJ.pt).confirm+' — '+((state.cfg&&state.cfg.nome_negocio)||APP_NAME), msg), '_blank');

  n.cart.forEach(c=> c.unit_ids.forEach(uidv=>{
    const u = state.units.find(x=>x.id===uidv);
    if(u) u.estado = 'alugada';
  }));
  rentalsGerados.reverse().forEach(r=> state.rentals.unshift(r));
  saveLocal();
  state.novo = { cliente_nome:'', cliente_telefone:'', cliente_email:'', cliente_doc:'', cliente_pais:n.cliente_pais, catSel:n.catSel, cart:[], unidade:'dias', duracao:1, caucao:0, preco_manual:null, notas:'' };
  toast(rentalsGerados.length>1? rentalsGerados.length+' registos criados (prazos diferentes) — WhatsApp aberto ✅' : 'Aluguer registado — WhatsApp aberto ✅');
  closeModal();
  setAppView('ativos');
}

function renderAtivos(){ return renderRentalListView(state.rentals.filter(r=>!r.devolucao_real && r.estado!=='pendente'), false); }
function renderAtrasoView(){ return renderRentalListView(state.rentals.filter(r=>!r.devolucao_real && estadoEfectivo(r)==='atraso'), true); }

function renderRentalListView(list, isAtraso){
  const q = state.ativosFiltro.toLowerCase();
  const catF = state.ativosCat;
  let filtered = list.filter(r=>{
    const matchQ = !q || r.cliente_nome.toLowerCase().includes(q) || (r.cliente_telefone||'').includes(q);
    const matchCat = !catF || (r.itens||[]).some(i=>{
      const item = state.items.find(x=>x.id===i.item_id);
      return item && item.category_id===catF;
    });
    return matchQ && matchCat;
  });
  filtered.sort((a,b)=> new Date(a.devolucao_prevista)-new Date(b.devolucao_prevista));

  return `
    <div class="toolbar">
      <input type="text" placeholder="Pesquisar cliente ou telefone..." value="${state.ativosFiltro}" oninput="setAtivosFiltro(this.value)">
      <select onchange="setAtivosCat(this.value)">
        <option value="">Todas as categorias</option>
        ${state.categories.map(c=>`<option value="${c.id}" ${catF===c.id?'selected':''}>${c.icone} ${c.nome}</option>`).join('')}
      </select>
    </div>
    ${filtered.length===0? `<div class="empty"><div class="ico">${isAtraso?'✅':'📋'}</div>${isAtraso?'Sem atrasos — tudo em dia.':'Nenhum aluguer activo.'}</div>` :
      `<div class="rental-grid">${filtered.map(r=>rentalCard(r)).join('')}</div>`}
  `;
}
function setAtivosFiltro(v){ state.ativosFiltro=v; render(); document.querySelector('.toolbar input')?.focus(); }
function setAtivosCat(v){ state.ativosCat=v; render(); }

   ============================================================ */
function renderHistorico(){
  const done = state.rentals.filter(r=>r.devolucao_real);
  const f = state.histFiltro;
  let filtered = done.filter(r=>{
    if(f.q && !r.cliente_nome.toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.de && new Date(r.criado_em) < new Date(f.de)) return false;
    if(f.ate && new Date(r.criado_em) > new Date(f.ate+'T23:59:59')) return false;
    return true;
  });
  filtered.sort((a,b)=> new Date(b.criado_em)-new Date(a.criado_em));

  return `
    <div class="toolbar">
      <input type="text" placeholder="Pesquisar cliente..." value="${f.q}" oninput="hist_bind('q',this.value)">
      <input type="date" value="${f.de}" oninput="hist_bind('de',this.value)" style="max-width:160px">
      <input type="date" value="${f.ate}" oninput="hist_bind('ate',this.value)" style="max-width:160px">
      <button class="btn sm" onclick="exportHistorico()">⇩ Exportar</button>
    </div>
    <div class="card"><div class="tablewrap" style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase">
          <th style="padding:10px 16px">Cliente</th><th>Artigos</th><th>Início</th><th>Devolvido</th><th>Estado</th>
        </tr></thead>
        <tbody>
        ${filtered.map(r=>`<tr style="border-top:1px solid var(--border)">
          <td style="padding:10px 16px">${r.cliente_nome}</td>
          <td>${(r.itens||[]).map(i=>i.quantidade+'× '+i.nome+(i.unit_codigos&&i.unit_codigos.length? ' ['+i.unit_codigos.join(', ')+']' : '')).join(', ')}</td>
          <td>${fmtDateTime(r.criado_em)}</td>
          <td>${fmtDateTime(r.devolucao_real)}</td>
          <td>${r.estado==='atraso'? '<span class="pill crit">Atraso</span>' : '<span class="pill ok">A tempo</span>'}</td>
        </tr>`).join('') || `<tr><td colspan="5" style="padding:24px;text-align:center;color:var(--muted)">Sem registos.</td></tr>`}
        </tbody>
      </table>
    </div></div>
  `;
}
function hist_bind(k,v){ state.histFiltro[k]=v; render(); }
function exportHistorico(){
  const done = state.rentals.filter(r=>r.devolucao_real);
  const rows = [['Cliente','Telefone','Artigos','Inicio','Devolvido','Estado']];
  done.forEach(r=> rows.push([r.cliente_nome, r.cliente_telefone||'', (r.itens||[]).map(i=>i.quantidade+'x '+i.nome).join('; '), fmtDateTime(r.criado_em), fmtDateTime(r.devolucao_real), r.estado]));
  const csv = rows.map(row=> row.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  if(!window.claude || !window.claude.downloads){ toast('Exportação não disponível nesta pré-visualização.'); return; }
  window.claude.downloads.save({ filename:'devolve-historico.txt', data: csv })
    .then(()=> toast('Histórico exportado.'))
    .catch(err=>{
      if(err && err.code==='declined') return;
      toast('Não foi possível exportar agora.');
    });
}

  return `<div class="field-extra-row"><b>${ex.chave}</b><span style="color:var(--muted)">(${ex.tipo}${ex.opcoes&&ex.opcoes.length?': '+ex.opcoes.join('/'):''})</span><span class="x" onclick="cf_removeExtra(${i})">✕</span></div>`;

function cf_addExtra(){
  const chave = prompt('Nome do campo (ex: tamanho, cor, nº série):');
  if(!chave) return;
  const tipo = confirm('Este campo tem opções fixas (ex: S/M/L)? OK = sim, Cancelar = texto livre') ? 'select' : 'texto';
  let opcoes = [];
  if(tipo==='select'){
    const raw = prompt('Opções separadas por vírgula (ex: S,M,L,XL):');
    opcoes = (raw||'').split(',').map(s=>s.trim()).filter(Boolean);
  }
  _catForm.campos_extra.push({chave, tipo, opcoes});
  renderModal(catModalHtml());
}
function cf_removeExtra(i){ _catForm.campos_extra.splice(i,1); renderModal(catModalHtml()); }

function saveCategoria(){
  const nome = el('cf-nome').value.trim();
  const icone = el('cf-icone').value.trim() || '📦';
  if(!nome){ toast('Dá um nome à categoria.'); return; }
  if(_catForm.id){
    const existing = state.categories.find(c=>c.id===_catForm.id);
    Object.assign(existing, { nome, icone, campos_extra: _catForm.campos_extra });
  } else {
    state.categories.push({ id:uid(), tenant_id: state.tenantId, nome, icone, campos_extra: _catForm.campos_extra, ordem: state.categories.length });
  }
  saveLocal();
  closeModal(); render();
}
function apagarCategoria(id){
  if(!confirm('Apagar esta categoria e todos os seus artigos?')) return;
  const itemIds = state.items.filter(i=>i.category_id===id).map(i=>i.id);
  state.categories = state.categories.filter(c=>c.id!==id);
  state.items = state.items.filter(i=>i.category_id!==id);
  state.units = state.units.filter(u=>!itemIds.includes(u.item_id));
  saveLocal();
  closeModal();
  render();
}

      </div>

        <div class="field"><label>Categoria</label><select id="if-cat">${state.categories.map(c=>`<option value="${c.id}" ${f.category_id===c.id?'selected':''}>${c.icone} ${c.nome}</option>`).join('')}</select></div>
        <div class="field"><label>Caução sugerida (€, opcional)</label><input type="number" min="0" step="1" id="if-caucao" value="${f.caucao_sugerida}" placeholder="Ex: 50"></div>
      </div>
      ${f.id? '' : `<div class="field"><label>Quantidade inicial (gera um código por unidade, ex: BTT-001, BTT-002...)</label><input type="number" min="0" id="if-qtd" value="${f.quantidade_inicial}"></div>`}
      ${f.id? `<div class="item-detail-units">
        <label>Unidades</label>
        <div class="chip-row">
          ${units.map(u=>`<div class="chip ${u.estado==='disponivel'?'u-ok':u.estado==='alugada'?'u-crit':'u-warn'}" title="${u.estado==='alugada'?'Em aluguer — não editável':'Toca para marcar manutenção/disponível'}" onclick="toggleUnidadeEstado('${u.id}')">${u.codigo}</div>`).join('')}
          <button class="btn sm" onclick="adicionarUnidade('${f.id}')">+ Unidade</button>
        </div>
      </div>` : ''}
    </div>
    <div class="modal-foot">
      ${f.id? `<button class="btn danger" onclick="apagarItem('${f.id}')">Apagar</button>` : ''}
      <button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveItem()">Guardar</button>
    </div>
  </div></div>`;
}
function if_onPhoto(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ _itemForm.foto = reader.result; renderModal(itemModalHtml()); };
  reader.readAsDataURL(file);
}
function saveItem(){
  const f = _itemForm;
  const nome = el('if-nome').value.trim();
  const preco = parseFloat(el('if-preco').value)||0;
  const caucaoSugerida = parseFloat(el('if-caucao').value)||0;
  const categoryId = el('if-cat').value;
  if(!nome){ toast('Dá um nome ao artigo.'); return; }
  if(!categoryId){ toast('Escolhe uma categoria.'); return; }
  if(f.id){
    const existing = state.items.find(i=>i.id===f.id);
    Object.assign(existing, { nome, preco, caucao_sugerida:caucaoSugerida, foto:f.foto, category_id:categoryId });
  } else {
    const qtd = parseInt(el('if-qtd').value)||0;
    const itemId = uid();
    state.items.push({ id:itemId, tenant_id: state.tenantId, category_id:categoryId, nome, preco, caucao_sugerida:caucaoSugerida, foto:f.foto, activo:true });
    for(let n=1; n<=qtd; n++){
      state.units.push({ id:uid(), tenant_id: state.tenantId, item_id:itemId, codigo:prefixoCodigo(nome)+'-'+String(n).padStart(3,'0'), atributos:{}, estado:'disponivel' });
    }
  }
  saveLocal();
  closeModal(); render();
}
function apagarItem(id){
  if(!confirm('Apagar este artigo e todas as suas unidades?')) return;
  state.items = state.items.filter(i=>i.id!==id);
  state.units = state.units.filter(u=>u.item_id!==id);
  saveLocal();
  closeModal();
  render();
}

function renderModal(html){
  let host = el('modal-root');
  if(!host){ host = document.createElement('div'); host.id='modal-root'; document.body.appendChild(host); }
  host.innerHTML = html;
}
function closeModal(){ const host = el('modal-root'); if(host) host.innerHTML=''; }

   CONFIGURAÇÕES

function toggleContaActiva(){
  if(!state.tenant) return;
  const activaAgora = state.tenant.conta_activa !== false;
  state.tenant.conta_activa = !activaAgora;
  saveLocal();
  toast(state.tenant.conta_activa? 'Conta reactivada.' : 'Conta suspensa — simulação activa.');
  render();
}
function baseDoPagamento(){
  const t = state.tenant;
  // pagou em dia (ou adiantado) → conta a partir do prazo actual, nunca perde dias já pagos
  // pagou atrasado → conta a partir de hoje
  return (t && t.proximo_pagamento && new Date(t.proximo_pagamento) > new Date())
    ? new Date(t.proximo_pagamento)
    : new Date();
}
let _pagamentoMeses = 1;
function abrirModalPagamento(){
  _pagamentoMeses = 1;
  renderModal(pagamentoModalHtml());
}
function pagamentoModalHtml(){
  const base = baseDoPagamento();
  const resultado = addMonths(base, _pagamentoMeses);
  const atraso = pagamentoEmAtraso();
  return `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-head"><h3>💳 Marcar pagamento</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">${atraso? 'Estava em atraso — a contagem começa a partir de <b style=\"color:var(--text-bright)\">hoje</b>.' : (state.tenant&&state.tenant.proximo_pagamento? 'Ainda dentro do prazo — a contagem soma a partir de <b style=\"color:var(--text-bright)\">'+fmtDate(state.tenant.proximo_pagamento)+'</b>, sem perder dias já pagos.' : 'Primeiro pagamento.')}</p>
      <div class="field">
        <label>Quantos meses foram pagos?</label>
        <input type="number" min="1" max="24" id="pg-meses" value="${_pagamentoMeses}" oninput="pg_setMeses(this.value)">
      </div>
      <div class="summary-devol">Fica activa até: <b>${fmtDate(resultado)}</b> ${_pagamentoMeses>1? `<span style="color:var(--muted);font-weight:400">(${_pagamentoMeses} meses)</span>` : ''}</div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmarPagamento()">✅ Confirmar pagamento</button></div>
  </div></div>`;
}
function pg_setMeses(v){
  const n = parseInt(v)||1;
  _pagamentoMeses = Math.min(24, Math.max(1, n));
  renderModal(pagamentoModalHtml());
}
function confirmarPagamento(){
  if(!state.tenant) return;
  const base = baseDoPagamento();
  const novaData = addMonths(base, _pagamentoMeses);
  state.tenant.proximo_pagamento = novaData.toISOString();
  state.tenant.conta_activa = true;
  saveLocal();
  toast(`Pagamento de ${_pagamentoMeses} ${_pagamentoMeses===1?'mês':'meses'} registado — activa até ${fmtDate(novaData)}`);
  closeModal();
  render();
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function renderAnalytics(){
  const CAT_COLORS = ['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)'];
  const confirmados = state.rentals.filter(r=>r.estado!=='pendente');
  const last30 = Array.from({length:30}, (_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(29-i)); d.setHours(0,0,0,0);
    return d;
  });
  const revByDay = last30.map(d=>{
    const next = new Date(d); next.setDate(next.getDate()+1);
    return confirmados.filter(r=> new Date(r.criado_em)>=d && new Date(r.criado_em)<next).reduce((s,r)=>s+(r.preco_total||0),0);
  });
  const receitaTotal = revByDay.reduce((a,b)=>a+b,0);

  // artigos mais alugados (magnitude — um só tom, a categoria não importa aqui)
  const itemCounts = {};
  confirmados.forEach(r=>(r.itens||[]).forEach(i=>{ itemCounts[i.nome]=(itemCounts[i.nome]||0)+i.quantidade; }));
  const ranking = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxRank = ranking.length? ranking[0][1] : 1;

  // receita por categoria (identidade — cor fixa por categoria, não por posição no ranking)
  const catNomeById = {}; state.categories.forEach(c=>catNomeById[c.id]=c.nome);
  const itemCatById = {}; state.items.forEach(i=>itemCatById[i.id]=i.category_id);
  const revByCat = {};
  confirmados.forEach(r=>(r.itens||[]).forEach(l=>{
    const catId = itemCatById[l.item_id]; if(!catId) return;
    const preco = precoPorUnidade(state.items.find(i=>i.id===l.item_id), r.unidade_duracao, r.duracao) * l.quantidade;
    revByCat[catId] = (revByCat[catId]||0) + preco;
  }));
  const catRanking = state.categories.map(c=>({nome:c.nome, icone:c.icone, valor:revByCat[c.id]||0})).sort((a,b)=>b.valor-a.valor);
  const maxCat = Math.max(...catRanking.map(c=>c.valor), 1);

  // ocupação actual por categoria (identidade — mesma cor fixa da categoria)
  const ocupCat = state.categories.map((c,i)=>{
    const itemIds = state.items.filter(it=>it.category_id===c.id).map(it=>it.id);
    const unidades = state.units.filter(u=>itemIds.includes(u.item_id));
    const fora = unidades.filter(u=>u.estado==='alugada').length;
    return { nome:c.nome, icone:c.icone, pct: unidades.length? Math.round(fora/unidades.length*100) : 0, cor: CAT_COLORS[i%CAT_COLORS.length] };
  });

  const finished = confirmados.filter(r=>r.devolucao_real);
  const onTime = finished.filter(r=>r.estado!=='atraso').length;
  const pctOnTime = finished.length? Math.round(onTime/finished.length*100) : 0;

  const duracoes = confirmados.map(r=> r.unidade_duracao==='dias'? r.duracao : r.duracao/24);
  const duracaoMedia = duracoes.length? (duracoes.reduce((a,b)=>a+b,0)/duracoes.length) : 0;

  const porCliente = {};
  confirmados.forEach(r=>{ const k=r.cliente_telefone||r.cliente_nome; if(!k) return; porCliente[k]=porCliente[k]||{nome:r.cliente_nome,pais:r.cliente_pais,n:0,receita:0}; porCliente[k].n++; porCliente[k].receita+=(r.preco_total||0); });
  const clientesArr = Object.values(porCliente);
  const recorrentes = clientesArr.filter(c=>c.n>1).length;
  const topClientes = [...clientesArr].sort((a,b)=>b.receita-a.receita).slice(0,5);
  const ticketMedio = confirmados.length? receitaTotal/confirmados.length : 0;

  setTimeout(()=>drawAreaChart('chart-30d', revByDay), 0);

  return `
    <div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat ok"><span class="stat-ico">💶</span><div class="lbl">Receita (30d)</div><div class="num tabular" style="font-size:24px">€${receitaTotal.toFixed(0)}</div></div>
      <div class="stat ok"><span class="stat-ico">🎫</span><div class="lbl">Ticket médio</div><div class="num tabular" style="font-size:24px">€${ticketMedio.toFixed(0)}</div></div>
      <div class="stat warn"><span class="stat-ico">⏱️</span><div class="lbl">Duração média</div><div class="num tabular" style="font-size:24px">${duracaoMedia.toFixed(1)}d</div></div>
      <div class="stat ok"><span class="stat-ico">🔁</span><div class="lbl">Clientes recorrentes</div><div class="num tabular" style="font-size:24px">${recorrentes}</div></div>
    </div>
    <div class="stat-row" style="grid-template-columns:1fr;margin-bottom:16px">
      <div class="stat ok" style="cursor:default"><span class="stat-ico">✅</span><div class="lbl">Devoluções a tempo</div><div class="num tabular">${pctOnTime}%</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px" class="analytics-grid">
      <div class="chart-box">
        <div class="section-title" style="font-size:14px">Receita — últimos 30 dias</div>
        <canvas id="chart-30d" height="140"></canvas>
      </div>
      <div class="chart-box">
        <div class="section-title" style="font-size:14px">Artigos mais alugados</div>
        ${ranking.length===0? `<div class="empty" style="padding:20px">Sem dados ainda.</div>` :
          ranking.map(([nome,count])=>`<div class="rank-row"><span style="min-width:110px">${nome}</span><div class="bar-track"><div class="bar" style="width:${Math.round(count/maxRank*100)}%"></div></div><span class="tabular" style="min-width:24px;text-align:right">${count}</span></div>`).join('')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px" class="analytics-grid">
      <div class="chart-box">
        <div class="section-title" style="font-size:14px">Receita por categoria</div>
        ${catRanking.length===0? `<div class="empty" style="padding:20px">Sem categorias.</div>` :
          catRanking.map((c,i)=>`<div class="rank-row"><span style="min-width:110px">${c.icone} ${c.nome}</span><div class="bar-track"><div class="bar" style="width:${Math.round(c.valor/maxCat*100)}%;background:${CAT_COLORS[state.categories.findIndex(x=>x.nome===c.nome)%CAT_COLORS.length]}"></div></div><span class="tabular" style="min-width:44px;text-align:right">€${c.valor.toFixed(0)}</span></div>`).join('')}
      </div>
      <div class="chart-box">
        <div class="section-title" style="font-size:14px">Ocupação actual por categoria</div>
        ${ocupCat.length===0? `<div class="empty" style="padding:20px">Sem categorias.</div>` :
          ocupCat.map(c=>`<div class="rank-row"><span style="min-width:110px">${c.icone} ${c.nome}</span><div class="bar-track"><div class="bar" style="width:${c.pct}%;background:${c.cor}"></div></div><span class="tabular" style="min-width:36px;text-align:right">${c.pct}%</span></div>`).join('')}
      </div>
    </div>
    <div class="chart-box" style="margin-top:16px">
      <div class="section-title" style="font-size:14px">Top clientes por receita</div>
      ${topClientes.length===0? `<div class="empty" style="padding:20px">Ainda sem alugueres confirmados.</div>` :
        topClientes.map((c,i)=>`<div class="rank-row"><span style="min-width:16px;color:var(--muted);font-family:ui-monospace,monospace">${i+1}</span><span style="flex:1">${c.pais?countryByCode(c.pais).flag+' ':''}${c.nome}</span><span style="color:var(--muted);font-size:12px">${c.n} ${c.n===1?'aluguer':'alugueres'}</span><span class="tabular" style="min-width:56px;text-align:right;font-weight:700;color:var(--text-bright)">€${c.receita.toFixed(0)}</span></div>`).join('')}
    </div>
    <style>@media(max-width:820px){.analytics-grid{grid-template-columns:1fr!important}}</style>
  `;
}
function drawAreaChart(canvasId, values){
  const canvas = el(canvasId); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth || 600, h = 140;
  canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...values, 1);
  const padL = 4, padR = 4, padT = 14, padB = 18;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const stepX = plotW/(values.length-1||1);
  const yFor = v => padT + plotH - (v/max)*plotH;

  // grelha discreta (recessiva)
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){ const y = padT + (plotH/3)*i; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); }

  // área com gradiente
  const grad = ctx.createLinearGradient(0,padT,0,padT+plotH);
  grad.addColorStop(0,'rgba(45,212,191,.35)'); grad.addColorStop(1,'rgba(45,212,191,.02)');
  ctx.beginPath();
  ctx.moveTo(padL, yFor(values[0]));
  values.forEach((v,i)=> ctx.lineTo(padL+i*stepX, yFor(v)));
  ctx.lineTo(padL+(values.length-1)*stepX, padT+plotH);
  ctx.lineTo(padL, padT+plotH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // linha
  ctx.beginPath();
  values.forEach((v,i)=>{ const x=padL+i*stepX, y=yFor(v); i===0? ctx.moveTo(x,y) : ctx.lineTo(x,y); });
  ctx.strokeStyle = '#2dd4bf'; ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.stroke();

  // ponto final em destaque + valor
  const lastX = padL+(values.length-1)*stepX, lastY = yFor(values[values.length-1]);
  ctx.beginPath(); ctx.arc(lastX,lastY,4,0,Math.PI*2); ctx.fillStyle='#2dd4bf'; ctx.fill();
  ctx.beginPath(); ctx.arc(lastX,lastY,4,0,Math.PI*2); ctx.strokeStyle='#0d1117'; ctx.lineWidth=2; ctx.stroke();
  const lastVal = values[values.length-1];
  ctx.font = '11px -apple-system,sans-serif'; ctx.fillStyle = '#f0f6fc'; ctx.textAlign = 'right';
  ctx.fillText('€'+lastVal.toFixed(0), Math.min(lastX+2, w-padR), Math.max(lastY-8, 12));
}

(function init(){
  const existing = loadLocal();
  if(existing && existing.tenant){
    hydrateFromLocal(existing);
    state.loading = false; state.view = 'app'; state.appView = 'dashboard';
    render();
    startTicker();
  } else {
    state.loading = false;
    render();
  }
})();
