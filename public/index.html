<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panini WC2026 — Troca de Cromos</title>
  <meta name="description" content="Plataforma de troca de cromos da caderneta Panini do Mundial 2026">
  <meta name="theme-color" content="#003DA5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="app-wrapper" id="app">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">⚽</div>
        <div class="logo-text">Panini WC2026</div>
        <div class="logo-sub">Troca de Cromos</div>
      </div>

      <div class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Principal</div>
          <button class="nav-item" data-route="/">🏠 Início</button>
          <button class="nav-item" data-route="/catalog">📚 Catálogo</button>
          <button class="nav-item" data-route="/collection">🗂️ Colecção</button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Trocas</div>
          <button class="nav-item" data-route="/matches">🎯 Matches</button>
          <button class="nav-item" data-route="/trades">🔄 Trocas</button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Conta</div>
          <button class="nav-item" data-route="/notifications">
            🔔 Notificações
            <span class="nav-badge notif-count" id="notif-count"></span>
          </button>
          <button class="nav-item" data-route="/profile">👤 Perfil</button>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-pill" data-route="/profile">
          <div class="user-avatar" id="nav-avatar">U</div>
          <div class="user-info">
            <div class="user-name" id="nav-username">Utilizador</div>
            <div class="user-loc" id="nav-userloc"></div>
          </div>
        </div>
        <button class="nav-item" id="logout-btn" style="margin-top:6px;color:var(--danger);">
          🚪 Sair
        </button>
      </div>
    </nav>

    <!-- Main -->
    <div class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="topbar-title" id="topbar-title">Panini WC2026</div>
        <div class="topbar-actions">
          <button class="notif-bell-btn" onclick="window.location.hash='/notifications'" title="Notificações">
            🔔
            <span class="notif-count" id="notif-count-top"></span>
          </button>
          <button class="btn btn-primary btn-sm" onclick="window.location.hash='/matches'">
            🎯 Matches
          </button>
        </div>
      </header>

      <div id="main-content" style="flex:1;overflow-y:auto;">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
