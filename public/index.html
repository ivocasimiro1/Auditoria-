<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panini WC2026 — Troca de Cromos</title>
  <meta name="description" content="Plataforma de troca de cromos da caderneta Panini do Mundial 2026">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Panini 2026">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://flagcdn.com">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="app-wrapper" id="app">
    <!-- Overlay must be INSIDE app-wrapper so z-index competes in the same stacking context -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-ball">⚽</div>
        <div>
          <div class="logo-text">Panini WC2026</div>
          <div class="logo-sub">Troca de Cromos</div>
        </div>
        <button class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">✕</button>
      </div>

      <div class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Principal</div>
          <button class="nav-item" data-route="/">
            <span class="nav-icon">🏠</span> Início
          </button>
          <button class="nav-item" data-route="/catalog">
            <span class="nav-icon">📚</span> Catálogo
          </button>
          <button class="nav-item" data-route="/collection">
            <span class="nav-icon">🗂️</span> Colecção
          </button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Trocas</div>
          <button class="nav-item" data-route="/matches">
            <span class="nav-icon">🎯</span> Matches
          </button>
          <button class="nav-item" data-route="/trades">
            <span class="nav-icon">🔄</span> Trocas
          </button>
          <button class="nav-item" data-route="/listings">
            <span class="nav-icon">🏪</span> Anúncios
          </button>
          <button class="nav-item" data-route="/orders">
            <span class="nav-icon">📦</span> Encomendas
          </button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Conta</div>
          <button class="nav-item" data-route="/notifications">
            <span class="nav-icon">🔔</span> Notificações
            <span class="nav-badge" id="notif-count"></span>
          </button>
          <button class="nav-item" data-route="/profile">
            <span class="nav-icon">👤</span> Perfil
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-pill" id="nav-user-pill" data-route="/profile">
          <div class="user-avatar" id="nav-avatar">U</div>
          <div>
            <div class="user-name" id="nav-username">Utilizador</div>
            <div class="user-loc" id="nav-userloc"></div>
          </div>
        </div>
        <button class="logout-btn" id="logout-btn">
          🚪 Sair
        </button>
      </div>
    </nav>

    <!-- Main -->
    <div class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="topbar-title" id="topbar-title">Panini WC2026</div>
        <div class="topbar-actions">
          <button class="notif-bell-btn" onclick="window.location.hash='/notifications'" title="Notificações">
            🔔
            <span class="notif-count" id="notif-count-top"></span>
          </button>
          <button class="btn btn-primary btn-sm" onclick="window.location.hash='/matches'">
            🎯 Matches
          </button>
        </div>
      </header>

      <div id="main-content" class="page-scroll">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- Bottom tab bar (mobile) -->
  <nav class="bottom-tabs" id="bottom-tabs" aria-label="Navegação principal">
    <button class="bottom-tab" data-route="/" aria-label="Início">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Início</span>
    </button>
    <button class="bottom-tab" data-route="/catalog" aria-label="Catálogo">
      <span class="tab-icon">📚</span>
      <span class="tab-label">Catálogo</span>
    </button>
    <button class="bottom-tab" data-route="/matches" aria-label="Matches">
      <span class="tab-icon">🎯</span>
      <span class="tab-label">Matches</span>
    </button>
    <button class="bottom-tab" data-route="/trades" aria-label="Trocas">
      <span class="tab-icon">🔄</span>
      <span class="tab-label">Trocas</span>
    </button>
    <button class="bottom-tab" data-route="/profile" aria-label="Perfil">
      <span class="tab-icon">👤</span>
      <span class="tab-label">Perfil</span>
    </button>
  </nav>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
